<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <style>
        /* RESET DE ESTILOS */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #202124;
        }

        /* BARRA SUPERIOR (NAV) */
        header {
            height: 60px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 0 20px;
        }

        header a {
            text-decoration: none;
            color: rgba(0,0,0,0.87);
            font-size: 13px;
            margin-right: 15px;
        }

        header a:hover {
            text-decoration: underline;
        }

        .user-icon {
            background-color: #1a73e8;
            color: white;
            padding: 9px 23px;
            border-radius: 4px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-left: 10px;
        }

        /* CONTENIDO PRINCIPAL */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: -50px; /* Sube un poco el logo para que se vea centrado */
        }

        .logo {
            width: 272px;
            margin-bottom: 30px;
        }

        /* BARRA DE BÚSQUEDA */
        .search-box {
            width: 90%;
            max-width: 584px;
            border: 1px solid #dfe1e5;
            border-radius: 24px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            height: 46px;
            transition: box-shadow 0.2s;
        }

        .search-box:hover {
            box-shadow: 0 1px 6px rgba(32,33,36,0.28);
            border-color: rgba(223,225,229,0);
        }

        .search-icon {
            color: #9aa0a6;
            width: 20px;
            margin-right: 10px;
        }

        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
        }

        .search-tools {
            display: flex;
            align-items: center;
        }

        /* ESTO ARREGLA TUS ICONOS GIGANTES */
        .search-tools img {
            width: 24px;
            height: 24px;
            margin-left: 12px;
            cursor: pointer;
        }

        /* BOTONES CENTRALES */
        .button-wrapper {
            margin-top: 25px;
        }

        .btn {
            background-color: #f8f9fa;
            border: 1px solid #f8f9fa;
            color: #3c4043;
            font-size: 14px;
            margin: 5px;
            padding: 0 16px;
            line-height: 34px;
            height: 36px;
            min-width: 54px;
            text-align: center;
            cursor: pointer;
            border-radius: 4px;
        }

        .btn:hover {
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
            border: 1px solid #dadce0;
            color: #202124;
        }

        .lang {
            margin-top: 25px;
            font-size: 13px;
        }

        .lang a {
            color: #1a0dab;
            text-decoration: none;
            margin-left: 5px;
        }

        /* FOOTER */
        footer {
            background: #f2f2f2;
            color: #70757a;
        }

        .location {
            padding: 15px 30px;
            border-bottom: 1px solid #dadce0;
        }

        .footer-links {
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            flex-wrap: wrap;
        }

        .footer-links ul {
            list-style: none;
            display: flex;
        }

        .footer-links li {
            padding: 15px;
        }

        .footer-links a {
            color: #70757a;
            text-decoration: none;
            font-size: 14px;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <a href="#">Gmail</a>
        <a href="#">Imágenes</a>
        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/17/17704.png" width="18" style="opacity: 0.6;" alt="Menu"></a>
        <button class="user-icon">Iniciar sesión</button>
    </header>

    <main>
        <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png" alt="Google" class="logo">
        
        <div class="search-box">
            <svg class="search-icon" focusable="false" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
            <input type="text" class="search-input">
            <div class="search-tools">
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e8/Google_mic.svg" alt="Voz">
                <img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/Google_Lens_2023.svg" alt="Lens">
            </div>
        </div>

        <div class="button-wrapper">
            <button class="btn">Buscar con Google</button>
            <button class="btn">Voy a tener suerte</button>
        </div>

        <p class="lang">Ofrecido por Google en: <a href="#">Español (Latinoamérica)</a></p>
    </main>

    <footer>
        <div class="location">México</div>
        <div class="footer-links">
            <ul>
                <li><a href="#">Sobre Google</a></li>
                <li><a href="#">Publicidad</a></li>
                <li><a href="#">Negocios</a></li>
                <li><a href="#">Cómo funciona la Búsqueda</a></li>
            </ul>
            <ul>
                <li><a href="#">Privacidad</a></li>
                <li><a href="#">Condiciones</a></li>
                <li><a href="#">Preferencias</a></li>
            </ul>
        </div>
    </footer>

</body>
</html>
